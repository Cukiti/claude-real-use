# Revisión de PRs con criterios del proyecto (REVIEW.md + .cru/).
# Alternativa personalizable al workflow oficial que instala /install-github-app.
# Requisitos: Claude GitHub App instalada y un secreto CLAUDE_CODE_OAUTH_TOKEN (claude setup-token)
# o ANTHROPIC_API_KEY. Verifica el formato con la documentación de claude-code-action antes de fusionarlo.
name: Claude Review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Revisa el PR #${{ github.event.pull_request.number }} de ${{ github.repository }}.
            Diff: `git diff origin/${{ github.base_ref }}...HEAD`.
            Criterios: REVIEW.md (obligatorio), CLAUDE.md, .cru/DECISIONS.md y la tarea o spec de .cru/ que el PR implementa.
            Reporta solo hallazgos que afectan a corrección o a esos criterios, cada uno con archivo:línea y cómo demostrar el fallo.
            Publica cada hallazgo como comentario en línea; si no hay ninguno, no publiques nada.
          claude_args: |
            --max-turns 20
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),mcp__github_inline_comment__create_inline_comment"
